<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      name="description"
      content="A shared family expense ledger that syncs in realtime across web and Android."

    <!--
      Two theme colours, because the app has a dark mode and a browser chrome
      bar can only take one. `light-dark()` picks per the OS setting, which is
      what the app's "system" theme follows anyway.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F7F4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161A" />
    <link rel="manifest" href="/manifest.json" />
  </head>
